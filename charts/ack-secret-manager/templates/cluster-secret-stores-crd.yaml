                        type: string
                      oidcTokenFilePath:
                        type: string
                      ramRoleARN:
                        type: string
                      ramRoleSessionName:
                        type: string
                      remoteRamRoleARN:
                        type: string
                      remoteRamRoleSessionName:
                        type: string
                      roleSessionExpiration:
