                  status. Consumers (the ExternalSecret reverse-watch predicates and the
                  client-freshness guard) use it to detect client rebuilds even when
                  metadata.generation is unchanged (e.g. trigger-annotation rotations).
                format: int64
                type: integer
              conditions:
