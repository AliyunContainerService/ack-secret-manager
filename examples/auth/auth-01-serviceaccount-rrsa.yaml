# ============================================================================
# ServiceAccount RRSA Authentication (Recommended)
# ============================================================================
#
# Difference from other RRSA methods:
#   - ServiceAccount RRSA: Controller isolates authentication at the ServiceAccount dimension referenced by SecretStore. Different ServiceAccounts map to different RAM Roles.
#   - RRSA (Environment Variables): Controller uses its own ServiceAccount for unified authentication. All ExternalSecrets share the same credentials.
#
# Prerequisites:
#   1. RRSA enabled on the cluster:
#      ack-ram-tool rrsa enable -c <clusterId>
#
#   2. Create a RAM Role with a trust policy pointing to the ServiceAccount:
#
#      aliyun ram CreateRole --RoleName kms-access-role --AssumeRolePolicyDocument '{
#        "Statement": [{
#          "Action": "sts:AssumeRole",
#          "Effect": "Allow",
#          "Principal": {
#            "Federated": "acs:ram::<accountId>:oidc-provider/ack-rrsa-<clusterId>"
#          },
#          "Condition": {
#            "StringEquals": {
#              "oidc:iss": ["https://oidc-ack-<region>.oss-<region>.aliyuncs.com/<clusterId>"],
#              "oidc:aud": ["sts.aliyuncs.com"],
#              "oidc:sub": ["system:serviceaccount:production:kms-access-sa"]
#            }
#          }
#        }],
#        "Version": "1"
#      }'
#
#   3. Attach KMS permissions to the RAM Role:
#
#      aliyun ram CreatePolicy --PolicyName kms-read --PolicyDocument '{
#        "Version": "1",
#        "Statement": [{
#          "Effect": "Allow",
#          "Action": ["kms:GetSecretValue", "kms:Decrypt"],
#          "Resource": ["acs:kms:<region>:<accountId>:secret/*"]
#        }]
#      }'
#
#      aliyun ram AttachPolicyToRole --PolicyType Custom --PolicyName kms-read --RoleName kms-access-role
#
#   4. Create a ServiceAccount and bind the RAM Role (see YAML below):
#      Note: The namespace and name of the ServiceAccount must exactly match the
#      oidc:sub value in the RAM Role trust policy: system:serviceaccount:<namespace>:<name>
#
# ============================================================================

# Step 1: Create ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kms-access-sa
  namespace: production
  annotations:
    ack.alibabacloud.com/role-arn: "acs:ram::<accountId>:role/kms-access-role"

---
# Step 2: Create SecretStore
apiVersion: 'alibabacloud.com/v1alpha1'
kind: SecretStore
metadata:
  name: kms-store
  namespace: production
spec:
  KMS:
    KMSAuth:
      serviceAccountRef:
        name: kms-access-sa
        # namespace: auth-system  # Optional: reference a ServiceAccount in another namespace (requires enableCrossNamespaceAuthRef to be true)

---
# Step 3: Create ExternalSecret
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: production
spec:
  provider: kms
  rotationInterval: 30s
  data:
    - key: my-database-password
      name: db-password
      versionId: v1
      secretStoreRef:
        name: kms-store
        kind: SecretStore

# ============================================================================
# Verification:
#
# 1. Check ExternalSecret status:
#    kubectl get externalsecret app-secret -n production
#
# 2. Check the generated Secret:
#    kubectl get secret app-secret -n production -o yaml
#
# 3. Check SecretStore status:
#    kubectl get secretstore kms-store -n production
#
# Notes:
#
# - oidc:sub must exactly match the ServiceAccount path: system:serviceaccount:<namespace>:<name>
# - The region in oidc:iss must match the cluster's region (e.g., cn-hangzhou, cn-beijing)
# - oidc:aud is fixed to sts.aliyuncs.com
# - serviceAccountRef.namespace supports cross-namespace references (controlled by enableCrossNamespaceAuthRef, default true)
# - ExternalSecret can also reference a SecretStore in another namespace via secretStoreRef.namespace
#   (controlled by enableCrossNamespaceSecretStore, default true)
#   Note: secretStoreRef.namespace is deprecated; use SecretStore in the same namespace or ClusterSecretStore instead
# ============================================================================
