# ============================================================================
# RRSA Authentication (Environment Variables + SecretStore, two methods)
# ============================================================================
#
# Two configuration methods:
#   Method A (Environment Variables): Component-level unified authentication, all ExternalSecrets share it
#   Method B (SecretStore): Namespace-level isolation, manage authentication per namespace
#
# Authentication Priority:
#   ServiceAccount RRSA > RRSA (OIDC) > AK AssumeRole > AK > WorkerRole
#   Exception: when oidcProviderARN is auto-derived (not explicitly configured) and complete
#   AccessKey credentials are configured, AK AssumeRole takes effect instead
#   ramRoleARN + oidcProviderARN in SecretStore use the same authentication path as environment variable RRSA
#
# Prerequisites:
#   1. RRSA enabled on the cluster:
#      ack-ram-tool rrsa enable -c <clusterId>
#   2. Create a RAM Role (environment variable method, trust policy points to the component ServiceAccount):
#
#      aliyun ram CreateRole --RoleName kms-component-role --AssumeRolePolicyDocument '{
#        "Statement": [{
#          "Action": "sts:AssumeRole",
#          "Effect": "Allow",
#          "Principal": {
#            "Federated": "acs:ram::<accountId>:oidc-provider/ack-rrsa-<clusterId>"
#          },
#          "Condition": {
#            "StringEquals": {
#              "oidc:iss": ["https://oidc-ack-<region>.oss-<region>.aliyuncs.com/<clusterId>"],
#              "oidc:aud": ["sts.aliyuncs.com"],
#              "oidc:sub": ["system:serviceaccount:kube-system:ack-secret-manager"]
#            }
#          }
#        }],
#        "Version": "1"
#      }'
#
#   3. Attach KMS permissions to the RAM Role:
#
#      aliyun ram CreatePolicy --PolicyName kms-read --PolicyDocument '{
#        "Version": "1",
#        "Statement": [{
#          "Effect": "Allow",
#          "Action": ["kms:GetSecretValue", "kms:Decrypt"],
#          "Resource": ["acs:kms:<region>:<accountId>:secret/*"]
#        }]
#      }'
#
#      aliyun ram AttachPolicyToRole --PolicyType Custom --PolicyName kms-read --RoleName kms-component-role
#
#   4. Create the RRSA parameter Secret:
#      kubectl create secret generic alibaba-credentials -n kube-system \
#        --from-literal=rolearn=acs:ram::<accountId>:role/kms-component-role \
#        --from-literal=oidcproviderarn=acs:ram::<accountId>:oidc-provider/ack-rrsa-<clusterId>
#
# ============================================================================

# ============================================================================
# Method A: Environment Variable RRSA (Component-level unified authentication)
# ============================================================================

# Step 1: Helm values configuration
#
# values.yaml:
#   rrsa:
#     enable: true
#   envVarsFromSecret:
#     ALICLOUD_ROLE_ARN:
#       secretKeyRef: alibaba-credentials
#       key: rolearn
#     ALICLOUD_OIDC_PROVIDER_ARN:
#       secretKeyRef: alibaba-credentials
#       key: oidcproviderarn
#
# Install command:
#   helm install ack-secret-manager charts/ack-secret-manager -f values.yaml

---
# Step 2: Create ExternalSecret (no secretStoreRef needed)
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: default
spec:
  provider: kms
  rotationInterval: 30s
  data:
    - key: my-database-password
      name: db-password
      versionId: v1
      # No secretStoreRef needed, uses environment variable RRSA authentication

# ============================================================================
# Method B: SecretStore RRSA (Namespace-level isolation)
# ============================================================================

---
# Step 1: Create SecretStore
apiVersion: 'alibabacloud.com/v1alpha1'
kind: SecretStore
metadata:
  name: rrsa-store
  namespace: production
spec:
  KMS:
    KMSAuth:
      ramRoleARN: acs:ram::<accountId>:role/kms-production-role
      oidcProviderARN: acs:ram::<accountId>:oidc-provider/ack-rrsa-<clusterId>

---
# Step 2: Create ExternalSecret (reference via secretStoreRef)
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: production
spec:
  provider: kms
  rotationInterval: 30s
  data:
    - key: my-database-password
      name: db-password
      versionId: v1
      secretStoreRef:
        name: rrsa-store
        kind: SecretStore

# ============================================================================
# Verification:
#
# 1. Check ExternalSecret status:
#    kubectl get externalsecret app-secret -n <namespace>
#
# 2. Check the generated Secret:
#    kubectl get secret app-secret -n <namespace> -o yaml
#
# 3. Check SecretStore status (Method B):
#    kubectl get secretstore rrsa-store -n production
#
# Notes:
#
# - Environment variable method: All ExternalSecrets share the same authentication, no secretStoreRef needed
# - SecretStore method: Isolated per namespace, different namespaces can use different RAM Roles
# - oidc:sub must exactly match the ServiceAccount path: system:serviceaccount:<namespace>:<name>
# - The region in oidc:iss must match the cluster's region (e.g., cn-hangzhou, cn-beijing)
# - oidc:aud is fixed to sts.aliyuncs.com
# ============================================================================
