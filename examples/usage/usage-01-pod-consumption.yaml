# ============================================================================
# Pod Consumption of Synced Secret (ExternalSecret -> K8s Secret -> Pod)
# ============================================================================
#
# This example shows how an application Pod consumes the Kubernetes Secret
# generated by ack-secret-manager, covering the three standard consumption
# methods:
#
#   Method 1: single key injected as an environment variable (secretKeyRef)
#   Method 2: entire Secret injected as environment variables (envFrom)
#   Method 3: Secret mounted as files (volume + volumeMounts)
#
# How rotation works for each method:
#   - Method 1/2: environment variables are captured at container start and
#     are NOT updated when the Secret rotates; restart the Pod to pick up the
#     new value.
#   - Method 3: kubelet refreshes mounted Secret volumes; propagation delay
#     depends on its sync period and cache strategy. Applications must re-read
#     the files to pick up rotated credentials.
#     Note: mounts via subPath are NOT refreshed by kubelet.
#
# Prerequisites:
#   1. KMS credentials have been created (my-database-password, api-key)
#   2. Authentication MUST be configured through ONE of the following:
#      a. SecretStore: create a SecretStore named "kms-store" in the
#         "production" namespace (this example references it via
#         secretStoreRef in each data entry).
#      b. Operator ENV: configure KMS credentials via environment variables
#         on the ack-secret-manager deployment. When using ENV-only auth,
#         you MUST remove the secretStoreRef block from BOTH data entries
#         below; the controller does NOT fall back to ENV when a
#         secretStoreRef is present but the referenced store is missing.
#
# Field notes:
#   - When spec.target.name is omitted, the generated K8s Secret has the same
#     name as the ExternalSecret (here: app-secret).
#   - rotationInterval controls how often the controller polls KMS/OOS
#     (shorter = faster rotation propagation, more API calls).
#
# ============================================================================

# ============================================================================
# Step 1: ExternalSecret - sync KMS credentials into a native K8s Secret
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret          # Generated K8s Secret gets the same name
  namespace: production
spec:
  provider: kms             # Options: kms, oos (default: kms)
  rotationInterval: 60s     # Poll interval for syncing from KMS
  data:
    - key: my-database-password   # KMS credential name (required)
      name: DB_PASSWORD           # Key name in the K8s Secret (optional; defaults to key)
      versionStage: ACSCurrent    # Track the current KMS credential version
      secretStoreRef:
        name: kms-store
        kind: SecretStore         # Options: SecretStore, ClusterSecretStore

    - key: api-key                # Second credential (used by envFrom / mount)
      name: API_KEY
      versionStage: ACSCurrent
      secretStoreRef:
        name: kms-store
        kind: SecretStore

# ============================================================================
# Step 2 (Method 1): single key injected as an environment variable
# ============================================================================
#
# Only the specified key is exposed, as env var DB_PASSWORD.
# After rotation: NOT auto-updated, restart the Pod to refresh.
#
#   kubectl logs app-env-single-key -n production
#   -> DB_PASSWORD is set
#
# ============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: app-env-single-key
  namespace: production
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", 'test -n "${DB_PASSWORD:-}" && echo "DB_PASSWORD is set"; while true; do sleep 3600; done']
      env:
        - name: DB_PASSWORD                     # Container env var name
          valueFrom:
            secretKeyRef:
              name: app-secret                  # Synced K8s Secret name
              key: DB_PASSWORD                  # Key inside the Secret
              optional: false                   # Pod fails to start if missing

# ============================================================================
# Step 2 (Method 2): entire Secret injected as environment variables
# ============================================================================
#
# Every key in the Secret becomes an env var of the same name:
#   DB_PASSWORD=<...>, API_KEY=<...>
#
# Tips:
#   - Use `prefix` to namespace the variables (e.g. APP_ -> APP_DB_PASSWORD).
#   - For shell compatibility, prefer UPPER_UNDERSCORE key names
#     (name: DB_PASSWORD) when targeting envFrom. Kubernetes allows '-' and
#     '.' in env var names, but they require quoting or special syntax in
#     most shells, so plain uppercase+underscore is the safest convention.
#   - 1 MiB is the Kubernetes Secret object size limit, NOT an envFrom safety
#     guarantee. The process environment is further bounded by the OS
#     argv+env space (e.g. ARG_MAX ~2 MiB on Linux); Secrets approaching
#     the 1 MiB limit may cause containers to fail with E2BIG at startup.
#     For large credential payloads, prefer volume mounts over envFrom.
#
#   kubectl logs app-env-whole-secret -n production
#   -> DB_PASSWORD is set
#   -> API_KEY is set
#
# ============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: app-env-whole-secret
  namespace: production
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", 'test -n "${DB_PASSWORD:-}" && echo "DB_PASSWORD is set"; test -n "${API_KEY:-}" && echo "API_KEY is set"; while true; do sleep 3600; done']
      envFrom:
        - secretRef:
            name: app-secret
          # prefix: APP_    # Optional: prefix every variable name

# ============================================================================
# Step 2 (Method 3): Secret mounted as files (recommended for rotation)
# ============================================================================
#
# The volume items mapping exposes stable application-facing file names:
#   /etc/creds/database-password
#   /etc/creds/api-key
#
# After rotation: kubelet refreshes mounted files automatically, but not
# immediately. Applications must re-read the files to pick up new values.
#
#   kubectl exec app-volume-mount -n production -- ls /etc/creds
#   -> api-key  database-password
#
# ============================================================================

---
apiVersion: v1
kind: Pod
metadata:
  name: app-volume-mount
  namespace: production
spec:
  containers:
    - name: app
      image: busybox
      command: ["sh", "-c", 'test -f /etc/creds/database-password && echo "database-password file is present"; test -f /etc/creds/api-key && echo "api-key file is present"; while true; do sleep 3600; done']
      volumeMounts:
        - name: credential
          mountPath: /etc/creds             # One file per Secret key
          readOnly: true
  volumes:
    - name: credential
      secret:
        secretName: app-secret
        items:
          - key: DB_PASSWORD
            path: database-password
          - key: API_KEY
            path: api-key
        # defaultMode: 0400                  # Optional: file permission bits

# ============================================================================
# Method comparison:
#
# | Method       | In-container form        | After rotation              | Best for                          |
# |--------------|--------------------------|-----------------------------|-----------------------------------|
# | secretKeyRef | env var DB_PASSWORD      | Not updated (restart Pod)   | Apps reading a single value       |
# | envFrom      | one env var per key      | Not updated (restart Pod)   | Many keys injected at once        |
# | volume mount | mapped files in /etc/creds | Auto-refreshed by kubelet | Apps supporting hot file reload   |
#
# Verification:
#
# 1. Check the ExternalSecret data-sync status:
#    kubectl get externalsecret app-secret -n production \
#      -o jsonpath='{range .status.dataSyncResults[*]}{.ExternalSecretKey}{"\t"}{.status}{"\t"}{.reason}{"\t"}{.synchronizationTime}{"\n"}{end}'
#
# 2. Check that the generated Secret exists (without printing credential data):
#    kubectl get secret app-secret -n production
#
# 3. Verify each consumption method:
#    kubectl logs app-env-single-key -n production
#    kubectl logs app-env-whole-secret -n production
#    kubectl exec app-volume-mount -n production -- ls /etc/creds
#
# Notes:
#   - All Secret references here are required (optional defaults to false).
#     Containers cannot start normally before the Secret exists, or when a key
#     specified by secretKeyRef or volume items is missing. envFrom only injects
#     existing keys; the application must check its required variables itself.
#     Set optional: true only when the credential is genuinely optional and the
#     application handles its absence.
#   - Do NOT delete the ExternalSecret while Pods still consume the Secret:
#     the controller's finalizer deletes the target Secret on ExternalSecret
#     deletion, which breaks mounted/consumed Pods.
#   - rotationInterval trades rotation propagation speed against KMS API
#     call volume; tune it per environment.
# ============================================================================
