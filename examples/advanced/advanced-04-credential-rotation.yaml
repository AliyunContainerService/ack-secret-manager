# ============================================================================
# Credential Rotation Configuration
# ============================================================================
#
# ack-secret-manager supports automatic credential rotation. The controller periodically re-fetches the latest credentials from the backend (KMS/OOS) at the configured interval and syncs them to the K8s Secret, ensuring applications always use the latest credentials.
#
# Configuration Hierarchy (from highest to lowest):
#   1. Credential-level: ExternalSecret.spec.rotationInterval    -> Highest priority
#   2. Global:           command.pollingInterval (startup flag)   -> Lowest (used when rotationInterval is not configured)
#
# Prerequisites:
#   1. KMS credentials or OOS encrypted parameters have been created
#   2. SecretStore or environment variable authentication has been configured
#
# ============================================================================

# ============================================================================
# Global Default Rotation Interval (Helm values.yaml)
# ============================================================================
#
# All ExternalSecrets without rotationInterval configured will use this global interval.
#
# values.yaml:
#   command:
#     pollingInterval: "5m"  # Global default 2 minutes (120s), adjustable as needed

# ============================================================================
# Credential-Level Rotation Example
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: rotation-high-priority
  namespace: production
spec:
  provider: kms
  data:
    - key: high-priority-secret
      name: high-priority-secret
      versionId: v1
  rotationInterval: 30s  # Credential-level: 30-second rotation (overrides global)

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: rotation-normal
  namespace: production
spec:
  provider: kms
  data:
    - key: normal-secret
      name: normal-secret
      versionId: v1
  # rotationInterval not configured -> uses global command.pollingInterval

# ============================================================================
# Verification:
#
# 1. Check ExternalSecret status:
#    kubectl get externalsecret -n production
#
# 2. Check the generated Secret:
#    kubectl get secret rotation-high-priority -n production -o yaml
#
# 3. Observe rotation behavior (check controller logs):
#    kubectl logs -l app=ack-secret-manager -n kube-system | grep rotation
# ============================================================================
