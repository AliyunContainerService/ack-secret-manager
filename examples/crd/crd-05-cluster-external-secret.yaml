# ============================================================================
# ClusterExternalSecret
# ============================================================================
#
# Automatically create ExternalSecrets in multiple namespaces to achieve cross-namespace credential synchronization.
#
# How It Works:
#   ClusterExternalSecret created -> Controller periodically checks conditions ->
#   Matching namespaces -> Creates ExternalSecret in each matching namespace ->
#   ExternalSecret Controller syncs KMS credentials -> Generates Kubernetes Secret
#
# Prerequisites:
#   1. ClusterSecretStore has been created (see crd-02-cluster-secret-store.yaml)
#   2. KMS credentials have been created
#
# ============================================================================

# ============================================================================
# Basic ClusterExternalSecret
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: ClusterExternalSecret
metadata:
  name: global-db-secret
spec:
  # ExternalSecret configuration to be created
  externalSecretSpec:
    provider: kms
    rotationInterval: 30s
    data:
      - key: global-db-password
        name: db-password
        versionId: v1
        secretStoreRef:
          name: global-kms-store
          kind: ClusterSecretStore

  # Name of the ExternalSecret to create (optional, defaults to ClusterExternalSecret name)
  externalSecretName: db-secret

  # Add labels and annotations (optional)
  externalSecretMetadata:
    labels:
      managed-by: cluster-external-secret
      app: myapp
    annotations:
      description: "Global database password synchronized by CES"

  # Namespaces where ExternalSecrets will be created
  conditions:
    # Method 1: Explicitly list namespaces
    - namespaces:
        - production
        - staging
        - testing
    # Method 2: Use label selector
    - namespaceSelector:
        matchLabels:
          needs-db-access: "true"
    # Method 3: Use regular expressions
    - namespaceRegexes:
        - "dev-.*"
        - "test-.*"

  # Interval for checking new namespaces
  rotationInterval: 1m

# ============================================================================
# Multi-Credential ClusterExternalSecret
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ClusterExternalSecret
metadata:
  name: multi-credentials
spec:
  externalSecretSpec:
    provider: kms
    data:
      - key: prod-db-password
        name: db-password
        secretStoreRef:
          name: global-kms-store
          kind: ClusterSecretStore
      - key: prod-api-key
        name: api-key
        secretStoreRef:
          name: global-kms-store
          kind: ClusterSecretStore
      - key: prod-tls-cert
        name: tls-cert
        secretStoreRef:
          name: global-kms-store
          kind: ClusterSecretStore

  externalSecretName: app-credentials

  externalSecretMetadata:
    labels:
      managed-by: ces
      type: multi-credentials

  conditions:
    - namespaces:
        - production
        - staging

  rotationInterval: 2m

# ============================================================================
# Verification:
#
# 1. Check ClusterExternalSecret status:
#    kubectl get clusterexternalsecret global-db-secret
#
# 2. Check automatically created ExternalSecrets:
#    kubectl get externalsecret db-secret -n production
#    kubectl get externalsecret db-secret -n staging
#    kubectl get externalsecret db-secret -n testing
#
# 3. Check the generated Secret:
#    kubectl get secret db-secret -n production -o yaml
#
# Notes:
#
# - When a ClusterExternalSecret is deleted, its created ExternalSecrets are automatically deleted (finalizer mechanism)
# - If an ExternalSecret with the same name already exists in a namespace, it will be taken over and overwritten using Server-Side Apply
# - It is recommended to use a unique externalSecretName to avoid naming conflicts
# - Ensure the RAM Role has KMS access permissions for all target namespaces
# - When dealing with a large number of namespaces, adjust rotationInterval to avoid overly short sync intervals
# ============================================================================
