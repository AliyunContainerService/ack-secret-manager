# ============================================================================
# SecretStore Configuration Example
# ============================================================================
#
# SecretStore is a namespace-level authentication store that defines the credential configuration for accessing KMS. 
# ExternalSecret references a SecretStore via secretStoreRef to obtain authentication information.
#
# Cross-Namespace Reference Description:
#   Referrer            Target Resource  Namespace Field                 Control Parameter
#   ExternalSecret  ->  SecretStore      secretStoreRef.namespace        enableCrossNamespaceSecretStore (default false)
#   SecretStore     ->  ServiceAccount   serviceAccountRef.namespace     enableCrossNamespaceAuthRef (default false)
#   SecretStore     ->  Secret           accessKey.namespace, etc.       enableCrossNamespaceAuthRef (default false)
#
#   When the namespace field is not set, it references the same namespace; when set, it references the specified namespace.
#   When the control parameter is set to false, only same-namespace resources can be referenced even if the namespace field is set.
#
# Prerequisites:
#   1. KMS credentials have been created
#   2. Authentication method has been configured (see examples in the auth/ directory)
#
# ============================================================================

# ============================================================================
# Example 1: ServiceAccount RRSA Authentication
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: SecretStore
metadata:
  name: kms-store
  namespace: production
spec:
  KMS:
    KMSAuth:
      serviceAccountRef:
        name: kms-access-sa
        # namespace: auth-system  # Optional: reference a ServiceAccount in another namespace

# ============================================================================
# Example 2: AK Authentication (Prerequisite: Kubernetes Secret with AK credentials created)
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: SecretStore
metadata:
  name: ak-store
  namespace: production
spec:
  KMS:
    KMSAuth:
      accessKey:
        name: alibaba-credentials
        key: id
        # namespace: auth-system  # Optional: reference a Secret in another namespace
      accessKeySecret:
        name: alibaba-credentials
        key: secret
        # namespace: auth-system

# ============================================================================
# Example 3: Cross-Account SecretStore
# Built on top of any authentication method by adding remoteRamRoleARN + remoteRamRoleSessionName for AssumeRole
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: SecretStore
metadata:
  name: cross-account-store
  namespace: production
spec:
  KMS:
    KMSAuth:
      serviceAccountRef:
        name: kms-sa
      # Cross-account AssumeRole
      remoteRamRoleARN: acs:ram::<targetAccountId>:role/cross-account-role
      remoteRamRoleSessionName: ack-secret-manager

# ============================================================================
# ExternalSecret Using SecretStore
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: production
spec:
  provider: kms
  rotationInterval: 30s
  data:
    - key: my-database-password
      name: db-password
      versionId: v1
      secretStoreRef:
        name: kms-store
        kind: SecretStore

# ============================================================================
# Verification:
#
# 1. Check SecretStore status:
#    kubectl get secretstore kms-store -n production
#
# 2. Check detailed information:
#    kubectl describe secretstore kms-store -n production
#
# Notes:
#
# - SecretStore is a namespace-level resource; each namespace needs its own SecretStore
# - Cross-namespace references are disabled by default, controlled by enableCrossNamespaceSecretStore
# - For cross-account authentication, see advanced/advanced-02-cross-account.yaml
# ============================================================================
