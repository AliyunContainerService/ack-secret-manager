# ============================================================================
# Basic ExternalSecret
# ============================================================================
#
# ExternalSecret is a namespace-level credential synchronization resource that defines which credentials to sync from KMS/OOS and creates the corresponding Kubernetes Secret.
#
# data field description:
#   key:            Unique identifier of the target credential (e.g., KMS secret key) (required)
#   name:           Corresponding key name in the K8s Secret data
#   versionStage:   Version stage of the target credential
#   versionId:      Version ID of the target credential (not required for OOS provider)
#   jmesPath:       Extract specific fields from JSON/YAML credentials
#   secretStoreRef: Referenced SecretStore information
#   kmsEndpoint:    KMS service endpoint address
#
# secretStoreRef field description:
#   name:      Name of the SecretStore or ClusterSecretStore (required)
#   namespace: Namespace of the SecretStore
#   kind:      SecretStore or ClusterSecretStore (default: SecretStore)
#
# Prerequisites:
#   1. KMS credentials have been created
#   2. SecretStore or environment variable authentication has been configured
#
# ============================================================================

# ============================================================================
# Basic ExternalSecret (referencing SecretStore)
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: production
spec:
  provider: kms  # Options: kms, oos (default: kms)
  rotationInterval: 30s  # Sync interval
  data:
    - key: my-database-password  # KMS credential name
      name: db-password  # Key name in K8s Secret
      versionId: v1  # KMS credential version
      secretStoreRef:
        name: kms-store
        kind: SecretStore  # Options: SecretStore, ClusterSecretStore (defaults to SecretStore)

# ============================================================================
# Referencing ClusterSecretStore
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: production  # Can be in any namespace
spec:
  provider: kms
  data:
    - key: global-db-password
      name: db-password
      versionId: v1
      secretStoreRef:
        name: global-kms-store
        kind: ClusterSecretStore  # Must specify kind

# ============================================================================
# Using Environment Variable Authentication (no secretStoreRef needed)
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: default
spec:
  provider: kms
  rotationInterval: 30s
  data:
    - key: my-database-password
      name: db-password
      versionId: v1
      # No secretStoreRef needed, uses environment variable authentication

# ============================================================================
# Verification:
#
# 1. Check ExternalSecret status:
#    kubectl get externalsecret app-secret -n production
#
# 2. Check detailed information:
#    kubectl describe externalsecret app-secret -n production
#
# 3. Check the generated Secret:
#    kubectl get secret app-secret -n production -o yaml
# ============================================================================
