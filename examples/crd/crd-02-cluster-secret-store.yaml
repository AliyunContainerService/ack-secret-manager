# ============================================================================
# ClusterSecretStore Configuration Example
# ============================================================================
#
# Use Cases:
# - Globally shared KMS authentication (configure once, use everywhere)
# - Cross-namespace synchronization of the same credentials
# - Centralized authentication management
#
# ClusterSecretStore is a cluster-level authentication store that can be referenced by ExternalSecrets in any namespace. 
# It supports conditions-based access control to restrict which namespaces can use it.
#
# Comparison with SecretStore:
#   Feature          SecretStore              ClusterSecretStore
#   Scope            Single namespace         Entire cluster
#   Namespace        Yes                      No (cluster-level)
#   Access Control   None                     Restricted via conditions
#   Use Case         Multi-tenant isolation   Global sharing
#
# Prerequisites:
#   1. KMS credentials have been created
#   2. Authentication method has been configured (see examples in the auth/ directory)
#
# ============================================================================

# ============================================================================
# Basic ClusterSecretStore (recommended: configure conditions for access control)
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: ClusterSecretStore
metadata:
  name: global-kms-store  # Cluster-level, no namespace
spec:
  # Access control (recommended): Three methods, conditions are combined with "OR" logic
  conditions:
    # Method 1: Explicitly list namespaces
    - namespaces:
        - production
        - staging
        - testing
    # Method 2: Use label selector
    - namespaceSelector:
        matchLabels:
          environment: dev
    # Method 3: Use regular expressions
    - namespaceRegexes:
        - "dev-.*"
        - "test-.*"

  KMS:
    KMSAuth:
      serviceAccountRef:
        name: global-kms-sa
        namespace: auth-system  # ClusterSecretStore must specify namespace

# ============================================================================
# Cross-Account ClusterSecretStore
# ============================================================================

---
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ClusterSecretStore
metadata:
  name: cross-account-store
spec:
  KMS:
    KMSAuth:
      serviceAccountRef:
        name: kms-sa
        namespace: auth-system
      # Cross-account AssumeRole
      remoteRamRoleARN: acs:ram::<targetAccountId>:role/cross-account-role
      remoteRamRoleSessionName: ack-secret-manager

# ============================================================================
# Using ClusterSecretStore in Different Namespaces
# ============================================================================

---
# ExternalSecret in production namespace
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: prod-secret
  namespace: production  # Must satisfy conditions
spec:
  provider: kms
  data:
    - key: prod-db-password
      name: db-password
      versionId: v1
      secretStoreRef:
        name: global-kms-store
        kind: ClusterSecretStore  # Must specify kind

---
# ExternalSecret in dev namespace
apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: dev-secret
  namespace: dev-app  # Must have environment=dev label
spec:
  provider: kms
  data:
    - key: dev-db-password
      name: db-password
      versionId: v1
      secretStoreRef:
        name: global-kms-store
        kind: ClusterSecretStore

# ============================================================================
# Verification:
#
# 1. Check ClusterSecretStore status:
#    kubectl get clustersecretstore global-kms-store
#
# 2. Check detailed information:
#    kubectl describe clustersecretstore global-kms-store
#
# 3. Check ExternalSecrets in each namespace:
#    kubectl get externalsecret prod-secret -n production
#    kubectl get externalsecret dev-secret -n dev-app
#
# Notes:
#
# - Always configure spec.conditions to restrict access scope
# - serviceAccountRef.namespace must be explicitly specified (ClusterSecretStore has no default namespace)
# - ExternalSecret must specify kind: ClusterSecretStore, otherwise it defaults to SecretStore and will fail
# ============================================================================
