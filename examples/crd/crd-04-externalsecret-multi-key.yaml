# ============================================================================
# ExternalSecret Multi-Key Configuration + JMESPath Extraction
# ============================================================================
#
# Sync multiple KMS credentials into a single Kubernetes Secret, or use JMESPath to extract multiple fields from JSON credentials.
#
# Prerequisites:
#   1. KMS credentials have been created
#   2. SecretStore or environment variable authentication has been configured
#
# ============================================================================

# ============================================================================
# Multi-Key ExternalSecret
# ============================================================================

apiVersion: 'alibabacloud.com/v1alpha1'
kind: ExternalSecret
metadata:
  name: multi-secret
  namespace: production
spec:
  provider: kms
  data:
    # First credential
    - key: db-password
      name: database-password
      versionId: v1
      secretStoreRef:
        name: kms-store
        kind: SecretStore

    # Second credential (can specify a different endpoint)
    - key: api-key
      name: api-key
      versionId: v1
      kmsEndpoint: kms-vpc.cn-beijing.aliyuncs.com
      secretStoreRef:
        name: kms-store
        kind: SecretStore

    # Third credential
    - key: tls-cert
      name: tls-certificate
      versionId: v1
      secretStoreRef:
        name: kms-store


# ============================================================================
# Verification:
#
# 1. Check the generated Secret, confirm it contains all keys:
#    kubectl get secret multi-secret -n production -o yaml
#
# 2. Expected result:
#    data:
#      database-password: <base64>
#      api-key: <base64>
#      tls-certificate: <base64>
#
# Notes:
#
# - key is the credential identifier in KMS, name is the data key in the final K8s Secret
# - If name is omitted, key is used as the Secret's data key by default
# - kmsEndpoint priority: credential-level > global command.kmsEndpoint > default kms-vpc.{region}.aliyuncs.com
# ============================================================================
