# Cluster-scoped RBAC for the kubectl direct-install path, aligned with
# charts/ack-secret-manager/templates/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ack-secret-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes", "serviceaccounts"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "watch", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Retained one transitional version for rollback to <= 0.6.5 leader-for-life election (ConfigMap lock); remove in the next major release.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["configmaps/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["externalsecrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["externalsecrets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["secretstores"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch", "deletecollection"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["secretstores/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["clusterexternalsecrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["clusterexternalsecrets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["clustersecretstores"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch", "deletecollection"]
  - apiGroups: ["alibabacloud.com"]
    resources: ["clustersecretstores/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
