# ClusterRoleBindings for the kubectl direct-install path, aligned with
# charts/ack-secret-manager/templates/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ack-secret-manager
subjects:
- kind: ServiceAccount
  name: ack-secret-manager
  # Must match the namespace where the controller ServiceAccount is deployed.
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: ack-secret-manager
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ack-secret-manager-auth
subjects:
- kind: ServiceAccount
  name: ack-secret-manager
  # Must match the namespace where the controller ServiceAccount is deployed.
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
