{{- if .Values.crds.createClusterExternalSecret }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: (devel)
  labels:
    external-secrets.io/component: controller
  name: clusterexternalsecrets.alibabacloud.com
spec:
  group: alibabacloud.com
  names:
    categories:
    - external-secrets
    kind: ClusterExternalSecret
    listKind: ClusterExternalSecretList
    plural: clusterexternalsecrets
    shortNames:
    - ces
    singular: clusterexternalsecret
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.externalSecretSpec.secretStoreRef.name
      name: Store
      type: string
    - jsonPath: .spec.refreshTime
      name: Refresh Interval
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterExternalSecret is the Schema for the clusterexternalsecrets
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterExternalSecretSpec defines the desired state of ClusterExternalSecret.
            properties:
              externalSecretMetadata:
                description: The metadata of the external secrets to be created
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    type: object
                  labels:
                    additionalProperties:
                      type: string
                    type: object
                type: object
              externalSecretName:
                description: |-
                  The name of the external secrets to be created.
                  Defaults to the name of the ClusterExternalSecret
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              externalSecretSpec:
                description: The spec for the ExternalSecrets to be created
                properties:
                  data:
                    items:
                      properties:
                        jmesPath:
                          description: Optional array to specify what json key value
                            pairs to extract from a secret and mount as individual
                            secrets
                          items:
                            description: An individual json key value pair to mount
                            properties:
                              objectAlias:
                                description: File name in which to store the secret
                                  in.
                                type: string
                              path:
                                description: JMES path to use for retrieval
                                type: string
                            required:
                            - objectAlias
                            - path
                            type: object
                          type: array
                        key:
                          type: string
                        kmsEndpoint:
                          type: string
                        name:
                          type: string
                        secretStoreRef:
                          properties:
                            kind:
                              description: |-
                                Kind of the SecretStore resource (SecretStore or ClusterSecretStore)
                                Defaults to `SecretStore`
                              enum:
                              - SecretStore
                              - ClusterSecretStore
                              type: string
                            name:
                              type: string
                            namespace:
                              description: 'Deprecated : Namespace field is deprecated,
                                use SecretStore in the same namespace as ExternalSecret,
                                or use ClusterSecretStore'
                              type: string
                          required:
                          - name
                          type: object
                        versionId:
                          type: string
                        versionStage:
                          type: string
                      required:
                      - key
                      type: object
                    type: array
                  dataProcess:
                    items:
                      properties:
                        extract:
                          properties:
                            jmesPath:
                              description: Optional array to specify what json key
                                value pairs to extract from a secret and mount as
                                individual secrets
                              items:
                                description: An individual json key value pair to
                                  mount
                                properties:
                                  objectAlias:
                                    description: File name in which to store the secret
                                      in.
                                    type: string
                                  path:
                                    description: JMES path to use for retrieval
                                    type: string
                                required:
                                - objectAlias
                                - path
                                type: object
                              type: array
                            key:
                              type: string
                            kmsEndpoint:
                              type: string
                            name:
                              type: string
                            secretStoreRef:
                              properties:
                                kind:
                                  description: |-
                                    Kind of the SecretStore resource (SecretStore or ClusterSecretStore)
                                    Defaults to `SecretStore`
                                  enum:
                                  - SecretStore
                                  - ClusterSecretStore
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  description: 'Deprecated : Namespace field is deprecated,
                                    use SecretStore in the same namespace as ExternalSecret,
                                    or use ClusterSecretStore'
                                  type: string
                              required:
                              - name
                              type: object
                            versionId:
                              type: string
                            versionStage:
                              type: string
                          required:
                          - key
                          type: object
                        replaceRule:
                          items:
                            properties:
                              source:
                                type: string
                              target:
                                type: string
                            required:
                            - source
                            - target
                            type: object
                          type: array
                      type: object
                    type: array
                  provider:
                    type: string
                  rotationInterval:
                    description: The time in which the controller should reconcile
                      its objects and recheck namespaces for labels.
                    type: string
                  type:
                    type: string
                type: object
              namespaceSelectors:
                description: A list of labels to select by to find the Namespaces
                  to create the ExternalSecrets in. The selectors are ORed.
                items:
                  description: |-
                    A label selector is a label query over a set of resources. The result of matchLabels and
                    matchExpressions are ANDed. An empty label selector matches all objects. A null
                    label selector matches no objects.
                  properties:
                    matchExpressions:
                      description: matchExpressions is a list of label selector requirements.
                        The requirements are ANDed.
                      items:
                        description: |-
                          A label selector requirement is a selector that contains values, a key, and an operator that
                          relates the key and values.
                        properties:
                          key:
                            description: key is the label key that the selector applies
                              to.
                            type: string
                          operator:
                            description: |-
                              operator represents a key's relationship to a set of values.
                              Valid operators are In, NotIn, Exists and DoesNotExist.
                            type: string
                          values:
                            description: |-
                              values is an array of string values. If the operator is In or NotIn,
                              the values array must be non-empty. If the operator is Exists or DoesNotExist,
                              the values array must be empty. This array is replaced during a strategic
                              merge patch.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        required:
                        - key
                        - operator
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    matchLabels:
                      additionalProperties:
                        type: string
                      description: |-
                        matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                        map is equivalent to an element of matchExpressions, whose key field is "key", the
                        operator is "In", and the values array contains only "value". The requirements are ANDed.
                      type: object
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              rotationInterval:
                description: The time in which the controller should reconcile its
                  objects and recheck namespaces for labels.
                type: string
            required:
            - externalSecretSpec
            type: object
          status:
            description: ClusterExternalSecretStatus defines the observed state of
              ClusterExternalSecret.
            properties:
              conditions:
                items:
                  description: ClusterExternalSecretStatusCondition defines the observed
                    state of a ClusterExternalSecret resource.
                  properties:
                    message:
                      type: string
                    status:
                      type: string
                    type:
                      description: ClusterExternalSecretConditionType defines a value
                        type for ClusterExternalSecret conditions.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              externalSecretName:
                description: ExternalSecretName is the name of the ExternalSecrets
                  created by the ClusterExternalSecret
                type: string
              failedNamespaces:
                description: Failed namespaces are the namespaces that failed to apply
                  an ExternalSecret
                items:
                  description: ClusterExternalSecretNamespaceFailure represents a
                    failed namespace deployment and it's reason.
                  properties:
                    namespace:
                      description: Namespace is the namespace that failed when trying
                        to apply an ExternalSecret
                      type: string
                    reason:
                      description: Reason is why the ExternalSecret failed to apply
                        to the namespace
                      type: string
                  required:
                  - namespace
                  type: object
                type: array
              provisionedNamespaces:
                description: ProvisionedNamespaces are the namespaces where the ClusterExternalSecret
                  has secrets
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
