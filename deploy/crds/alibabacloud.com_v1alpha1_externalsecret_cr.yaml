# Minimal valid ExternalSecret example.
# Replace the placeholder values (secretStoreRef.name, data[].key) with real ones
# before applying. See examples/crd/crd-03-externalsecret-basic.yaml for details.
apiVersion: alibabacloud.com/v1alpha1
kind: ExternalSecret
metadata:
  name: example-externalsecret
spec:
  provider: kms  # Options: kms, oos (default: kms)
  rotationInterval: 30s  # Sync interval
  data:
    - key: example-secret-key  # Credential key in KMS/OOS
      name: example-secret-name  # Key name in the generated K8s Secret
      secretStoreRef:
        name: example-secretstore  # Name of the SecretStore to use
        kind: SecretStore  # Options: SecretStore, ClusterSecretStore (default: SecretStore)
